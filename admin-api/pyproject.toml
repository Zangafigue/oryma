[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oryma-admin-api"
version = "0.1.0"
description = "Service d'administration Oryma"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.1",
]

[project.scripts]
admin-api-migrate = "admin_api.migrations:main"
admin-api-bootstrap-local = "admin_api.local_bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
admin_api = ["sql_migrations/*.sql", "dev_harness/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
