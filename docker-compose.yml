name: oryma

services:
  postgres:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:?Configure SYNAPSE_DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Configure KEYCLOAK_DB_PASSWORD in .env}
      ADMINAPI_DB_PASSWORD: ${ADMINAPI_DB_PASSWORD:?Configure ADMINAPI_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  synapse:
    build: ./synapse
    restart: unless-stopped
    environment:
      ORYMA_HOST: ${ORYMA_HOST:?Configure ORYMA_HOST in .env before the first start}
      SYNAPSE_SERVER_NAME: ${ORYMA_HOST:?Configure ORYMA_HOST in .env before the first start}
      SYNAPSE_DB_PASSWORD: ${SYNAPSE_DB_PASSWORD:?Configure SYNAPSE_DB_PASSWORD in .env}
      SYNAPSE_REGISTRATION_SECRET: ${SYNAPSE_REGISTRATION_SECRET:?Configure SYNAPSE_REGISTRATION_SECRET in .env}
      SYNAPSE_MACAROON_SECRET: ${SYNAPSE_MACAROON_SECRET:?Configure SYNAPSE_MACAROON_SECRET in .env}
      SYNAPSE_FORM_SECRET: ${SYNAPSE_FORM_SECRET:?Configure SYNAPSE_FORM_SECRET in .env}
      OIDC_SYNAPSE_SECRET: ${OIDC_SYNAPSE_SECRET:?Configure OIDC_SYNAPSE_SECRET in .env}
      SYNAPSE_REPORT_STATS: "no"
      SSL_CERT_FILE: /caddy/caddy/pki/authorities/local/root.crt
    volumes:
      - synapse-data:/data
      - caddy-data:/caddy:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/_matrix/client/versions', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  element:
    image: vectorim/element-web:v1.12.33
    restart: unless-stopped
    volumes:
      - ./element/config.json:/app/config.json:ro
    networks: [internal]
    cap_drop: [ALL]

  keycloak:
    build: ./keycloak
    restart: unless-stopped
    command: start-dev --import-realm --http-relative-path=/auth
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: oryma-bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Configure KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Configure KEYCLOAK_DB_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${ORYMA_HOST:?Configure ORYMA_HOST in .env}/auth
      ORYMA_HOST: ${ORYMA_HOST:?Configure ORYMA_HOST in .env}
      OIDC_SYNAPSE_SECRET: ${OIDC_SYNAPSE_SECRET:?Configure OIDC_SYNAPSE_SECRET in .env}
      ADMIN_API_OIDC_SECRET: ${ADMIN_API_OIDC_SECRET:?Configure ADMIN_API_OIDC_SECRET in .env}
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
  admin-api:
    build: ./admin-api
    restart: unless-stopped
    environment:
      ADMINAPI_DATABASE_URL: postgresql://adminapi:${ADMINAPI_DB_PASSWORD:?Configure ADMINAPI_DB_PASSWORD in .env}@postgres:5432/adminapi
      KEYCLOAK_HEALTHCHECK_URL: http://keycloak:9000/auth/health/ready
      KEYCLOAK_ISSUER: https://${ORYMA_HOST:?Configure ORYMA_HOST in .env}/auth/realms/oryma
      KEYCLOAK_JWKS_INTERNAL_URL: http://keycloak:8080/auth/realms/oryma/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_ID: admin-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${ADMIN_API_OIDC_SECRET:?Configure ADMIN_API_OIDC_SECRET in .env}
      SYNAPSE_HEALTHCHECK_URL: http://synapse:8008/_matrix/client/versions
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      synapse:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ORYMA_HOST: ${ORYMA_HOST:?Configure ORYMA_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      external: {}
      internal:
        aliases: [oryma.local]
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/caddy/pki/authorities/local/root.crt && caddy version"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  external:
    name: oryma-external
  internal:
    name: oryma-internal
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  postgres-data:
  synapse-data:
  caddy-data:
  caddy-config:
